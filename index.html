<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamCraft AI</title>
<style>
body{background:#0a0a0f;color:#fff;font-family:system-ui;padding:20px}
textarea{width:100%;min-height:100px;background:#15151f;color:#fff;border:1px solid #444;border-radius:10px;padding:12px}
button{width:100%;padding:14px;background:linear-gradient(to right,#7c3aed,#06b6d4);border:none;border-radius:10px;color:#fff;font-weight:bold;margin-top:10px}
.scene{background:#1f1f2e;border:1px solid #6d28d9;border-radius:12px;padding:12px;margin:10px 0}
</style>
</head>
<body>
<h2>DreamCraft AI Studio</h2>
<textarea id="storyInput" placeholder="5 lines likho yahan..."></textarea>
<button onclick="generateStoryboard()">Generate Storyboard</button>

<div id="storyboardResult"></div>

<script>
function generateStoryboard(){
  const storyText = document.getElementById('storyInput').value;
  const resultDiv = document.getElementById('storyboardResult');
  resultDiv.innerHTML = ''; // purana delete - duplicate fix

  if(!storyText.trim()){
    alert('Please write a story first!');
    return;
  }
  const lines = storyText.split('\n').filter(l=>l.trim()!='');
  let html = '';
  lines.forEach((line,i)=>{
    html += `<div class="scene"><b style="color:#22d3ee">SCENE ${i+1}</b><br>${line}</div>`;
  });
  resultDiv.innerHTML = html;
}
</script>
</body>
</html>
